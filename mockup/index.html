<title>Comment Note</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">

<style>
:root{
  --desk:#D9D6D0;
  --bg:#F4F3F1;
  --surface:#FFFFFF;
  --surface-2:#FAF9F7;
  --surface-3:#EFEDE9;
  --border:#E3E0DB;
  --border-strong:#CFCBC4;
  --ink:#1A1917;
  --ink-2:#56534E;
  --ink-3:#8C877F;
  --accent:#B26B00;
  --accent-line:#C98A2B;
  --accent-wash:rgba(201,138,43,.20);
  --accent-wash-hi:rgba(201,138,43,.40);
  --accent-soft:rgba(201,138,43,.10);
  --link:#0F6E68;
  --sel:rgba(15,110,104,.18);
  --danger:#C4322B;
  --on-accent:#FFFFFF;
  --shadow:0 1px 2px rgba(26,25,23,.06), 0 12px 34px rgba(26,25,23,.14);
  --shadow-pop:0 2px 6px rgba(26,25,23,.10), 0 18px 40px rgba(26,25,23,.20);
  --font-ui:"IBM Plex Sans KR","Malgun Gothic",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono","Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --desk:#0D0C0B;
    --bg:#171614;
    --surface:#1D1C1A;
    --surface-2:#232220;
    --surface-3:#2A2825;
    --border:#2E2C28;
    --border-strong:#3D3A35;
    --ink:#EAE7E1;
    --ink-2:#A8A39A;
    --ink-3:#79746C;
    --accent:#E0A94A;
    --accent-line:#C08A34;
    --accent-wash:rgba(224,169,74,.22);
    --accent-wash-hi:rgba(224,169,74,.42);
    --accent-soft:rgba(224,169,74,.10);
    --link:#56C1B6;
    --sel:rgba(86,193,182,.22);
    --danger:#E0645B;
    --on-accent:#1A1917;
    --shadow:0 1px 2px rgba(0,0,0,.40), 0 16px 40px rgba(0,0,0,.55);
    --shadow-pop:0 2px 8px rgba(0,0,0,.50), 0 22px 48px rgba(0,0,0,.60);
  }
}
:root[data-theme="dark"]{
  --desk:#0D0C0B;
  --bg:#171614;
  --surface:#1D1C1A;
  --surface-2:#232220;
  --surface-3:#2A2825;
  --border:#2E2C28;
  --border-strong:#3D3A35;
  --ink:#EAE7E1;
  --ink-2:#A8A39A;
  --ink-3:#79746C;
  --accent:#E0A94A;
  --accent-line:#C08A34;
  --accent-wash:rgba(224,169,74,.22);
  --accent-wash-hi:rgba(224,169,74,.42);
  --accent-soft:rgba(224,169,74,.10);
  --link:#56C1B6;
  --sel:rgba(86,193,182,.22);
  --danger:#E0645B;
  --on-accent:#1A1917;
  --shadow:0 1px 2px rgba(0,0,0,.40), 0 16px 40px rgba(0,0,0,.55);
  --shadow-pop:0 2px 8px rgba(0,0,0,.50), 0 22px 48px rgba(0,0,0,.60);
}

*{box-sizing:border-box}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--font-ui);
  -webkit-font-smoothing:antialiased;overflow:hidden}
::selection{background:var(--sel)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:4px}

/* desk + window ------------------------------------------------ */
.desk{height:100dvh;display:flex;align-items:center;justify-content:center;padding:22px}
.win{width:100%;max-width:1340px;height:100%;max-height:920px;background:var(--bg);
  border:1px solid var(--border-strong);border-radius:10px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;overflow:hidden}
@media (max-width:900px){
  .desk{padding:0}
  .win{max-height:none;border-radius:0;border:0}
}

/* title bar ---------------------------------------------------- */
.titlebar{height:38px;flex:0 0 38px;display:flex;align-items:center;gap:10px;padding-left:12px;
  background:var(--surface-2);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;flex:0 0 auto}
.brand svg{width:15px;height:15px;color:var(--accent)}
.doctitle{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:8px;min-width:0}
.doctitle .sep{color:var(--border-strong)}
.doctitle .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip-mock{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent-wash);
  padding:1px 6px;border-radius:4px;flex:0 0 auto}
.tb-spacer{flex:1;height:100%;min-width:12px}
.wctl{display:flex;height:100%;flex:0 0 auto}
.wctl button{width:46px;height:100%;display:grid;place-items:center;color:var(--ink-2);border-radius:0}
.wctl button svg{width:10px;height:10px}
.wctl button:hover{background:var(--surface-3);color:var(--ink)}
.wctl button.close:hover{background:#C4322B;color:#fff}

/* toolbar ------------------------------------------------------ */
.toolbar{flex:0 0 44px;display:flex;align-items:center;gap:5px;padding:0 10px;background:var(--surface);
  border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.toolbar::-webkit-scrollbar{display:none}
.tbtn{height:28px;min-width:28px;padding:0 7px;display:grid;place-items:center;border-radius:6px;
  color:var(--ink-2);font-size:12px;font-weight:500;flex:0 0 auto;transition:background .12s,color .12s}
.tbtn:hover{background:var(--surface-3);color:var(--ink)}
.tbtn.bold{font-weight:700;font-size:13px}
.tbtn.ital{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:14px}
.tbtn.mono{font-family:var(--font-mono);font-size:11px}
.tbtn svg{width:15px;height:15px;display:block}
.tbtn.accent{color:var(--accent)}
.tbtn.accent:hover{background:var(--accent-soft)}
.vr{width:1px;height:18px;background:var(--border);flex:0 0 1px;margin:0 4px}
.seg{display:flex;background:var(--surface-3);border-radius:7px;padding:2px;gap:2px;flex:0 0 auto}
.seg button{height:24px;padding:0 10px;border-radius:5px;font-size:11.5px;font-weight:500;
  color:var(--ink-2);display:flex;align-items:center;gap:5px;white-space:nowrap}
.seg button svg{width:13px;height:13px;flex:0 0 13px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;
  box-shadow:0 1px 2px rgba(0,0,0,.10)}
.seg-label{font-family:var(--font-mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);flex:0 0 auto}
.anno-count{display:flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:6px;
  border:1px solid var(--accent-wash);background:var(--accent-soft);color:var(--accent);
  font-size:11.5px;font-weight:600;flex:0 0 auto}
.anno-count svg{width:13px;height:13px}
.anno-count .n{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* layout ------------------------------------------------------- */
.body{flex:1;display:flex;min-height:0}

.rail{width:222px;flex:0 0 222px;background:var(--surface-2);border-right:1px solid var(--border);
  display:flex;flex-direction:column;min-height:0;transition:margin-left .18s ease}
.rail.hidden{margin-left:-223px}
.rail-head{padding:12px 10px 8px;display:flex;flex-direction:column;gap:5px}
.rail-head h2{margin:0;font-family:var(--font-mono);font-size:10px;font-weight:500;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3)}
/* 저장 위치 */
.loc{width:100%;display:flex;align-items:center;gap:7px;height:30px;padding:0 7px;border-radius:7px;
  border:1px solid var(--border);background:var(--surface);text-align:left}
.loc:hover{border-color:var(--border-strong)}
.loc .ico{width:14px;height:14px;flex:0 0 14px;color:var(--accent)}
.loc .p{flex:1;min-width:0;font-family:var(--font-mono);font-size:10.5px;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loc .chev{width:11px;height:11px;flex:0 0 11px;color:var(--ink-3)}

/* 폴더 트리 */
.tree{flex:1;overflow-y:auto;padding:2px 6px 8px;display:flex;flex-direction:column;gap:1px;
  scrollbar-width:thin}
.tree::-webkit-scrollbar{width:10px}
.tree::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:9px;
  border:3px solid var(--surface-2)}
.row{width:100%;display:flex;align-items:center;gap:6px;height:26px;padding-right:7px;border-radius:6px;
  border-left:2px solid transparent;text-align:left;color:var(--ink)}
.row:hover{background:var(--surface-3)}
.row .chev{width:11px;height:11px;flex:0 0 11px;color:var(--ink-3);transition:transform .15s}
.row.open>.chev{transform:rotate(90deg)}
.row .ico{width:13px;height:13px;flex:0 0 13px;color:var(--ink-3)}
.row.dir>.ico{color:var(--accent-line)}
.row .nm{flex:1;min-width:0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ext{color:var(--ink-3)}
.row .cnt{font-family:var(--font-mono);font-size:10px;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.row .an{font-family:var(--font-mono);font-size:10px;color:var(--accent);font-variant-numeric:tabular-nums;
  display:flex;align-items:center;gap:3px}
.row .an svg{width:10px;height:10px}
.row.dir{font-weight:500}
.row.file[aria-current="true"]{background:var(--surface);border-left-color:var(--accent-line);
  box-shadow:0 1px 2px rgba(0,0,0,.06);font-weight:500}
.rail-foot{flex:0 0 auto;display:flex;gap:5px;padding:7px 8px 9px;border-top:1px solid var(--border)}
.rail-foot button{flex:1;height:26px;border-radius:6px;border:1px solid var(--border);
  background:var(--surface);font-size:11.5px;color:var(--ink-2);display:flex;align-items:center;
  justify-content:center;gap:5px}
.rail-foot button:hover{background:var(--surface-3);color:var(--ink)}
.rail-foot button svg{width:12px;height:12px}

.work{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.panes{flex:1;display:flex;min-height:0;background:var(--surface);position:relative}
.pane{flex:1;min-width:0;display:flex;flex-direction:column}
.pane.hide{display:none}
.pane-head{flex:0 0 30px;display:flex;align-items:center;gap:9px;padding:0 16px;
  border-bottom:1px solid var(--border);background:var(--surface-2)}
.pane-head .label{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3)}
.pane-head .hint{font-size:10.5px;color:var(--ink-3)}
.divider{flex:0 0 1px;background:var(--border);cursor:col-resize;position:relative}
.divider.hide{display:none}
.divider::after{content:"";position:absolute;top:0;bottom:0;left:-3px;right:-3px}
.divider:hover{background:var(--accent-line)}

.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}
.scroll::-webkit-scrollbar{width:11px}
.scroll::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:9px;
  border:3px solid var(--surface)}
.scroll::-webkit-scrollbar-track{background:transparent}

.src{font-family:var(--font-mono);font-size:13.5px;line-height:1.85;white-space:pre-wrap;
  word-break:break-word;padding:20px 22px 45vh;outline:none;caret-color:var(--accent);color:var(--ink)}

.doc{padding:26px 32px 45vh;max-width:70ch;margin:0 auto;outline:none;font-size:15px;line-height:1.78}
.doc h1,.doc h2,.doc h3{line-height:1.3;text-wrap:balance;margin:1.7em 0 .5em;font-weight:600}
.doc>:first-child{margin-top:0}
.doc h1{font-size:1.7em;font-weight:700;letter-spacing:-.015em}
.doc h2{font-size:1.26em;padding-bottom:.3em;border-bottom:1px solid var(--border)}
.doc h3{font-size:1.05em;color:var(--ink-2)}
.doc p{margin:.85em 0}
.doc ul,.doc ol{margin:.85em 0;padding-left:1.45em}
.doc li{margin:.25em 0}
.doc li::marker{color:var(--ink-3)}
.doc a{color:var(--link);text-decoration:none;border-bottom:1px solid var(--border-strong)}
.doc a:hover{border-bottom-color:var(--link)}
.doc code{font-family:var(--font-mono);font-size:.86em;background:var(--surface-3);padding:.12em .38em;
  border-radius:4px;border:1px solid var(--border)}
.doc pre{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;
  overflow-x:auto;margin:1.1em 0}
.doc pre code{background:none;border:0;padding:0;font-size:12.5px;line-height:1.7}
.doc blockquote{margin:1.1em 0;padding:.1em 0 .1em 15px;border-left:2px solid var(--border-strong);
  color:var(--ink-2)}
.doc hr{border:0;border-top:1px solid var(--border);margin:1.8em 0}
.doc img{max-width:100%;border-radius:8px;border:1px solid var(--border);display:block;margin:1.1em 0}
.doc mark{background:var(--accent-wash);color:inherit;padding:.06em .2em;border-radius:3px}
.doc .tw{overflow-x:auto;margin:1.1em 0}
.doc table{border-collapse:collapse;font-size:.92em;width:100%}
.doc th,.doc td{border:1px solid var(--border);padding:6px 11px;text-align:left}
.doc th{background:var(--surface-2);font-weight:600}
.doc td{font-variant-numeric:tabular-nums}

/* the annotation mark ------------------------------------------ */
.anno{background:var(--accent-wash);border-bottom:1.5px solid var(--accent-line);
  border-radius:2px 2px 0 0;cursor:pointer;transition:background .12s}
.anno:hover,.anno.active{background:var(--accent-wash-hi)}
.anno.flash{animation:flash 1s ease}
@keyframes flash{
  0%,100%{background:var(--accent-wash);box-shadow:none}
  30%{background:var(--accent-wash-hi);box-shadow:0 0 0 4px var(--accent-soft)}
}

/* annotation shelf --------------------------------------------- */
.shelf{flex:0 0 auto;background:var(--surface-2);border-top:1px solid var(--border);display:flex;
  flex-direction:column;max-height:240px}
.shelf-head{flex:0 0 32px;display:flex;align-items:center;gap:9px;padding:0 11px 0 14px}
.shelf-head h2{margin:0;font-family:var(--font-mono);font-size:10px;font-weight:500;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3)}
.shelf-head .n{font-family:var(--font-mono);font-size:10.5px;color:var(--accent);
  font-variant-numeric:tabular-nums}
.shelf-toggle{margin-left:auto;height:22px;padding:0 8px;border-radius:5px;color:var(--ink-2);
  font-size:11.5px;display:flex;align-items:center;gap:6px}
.shelf-toggle:hover{background:var(--surface-3);color:var(--ink)}
.shelf-toggle svg{width:12px;height:12px;transition:transform .18s}
.shelf.collapsed .shelf-toggle svg{transform:rotate(180deg)}
.shelf.collapsed .shelf-list,.shelf.collapsed .shelf-empty{display:none}
.shelf-list{overflow-y:auto;padding:0 10px 10px;display:flex;flex-direction:column;gap:6px;
  scrollbar-width:thin}
.shelf-list:empty{display:none}
.shelf-list::-webkit-scrollbar{width:10px}
.shelf-list::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:9px;
  border:3px solid var(--surface-2)}
.acard{display:grid;grid-template-columns:22px 1fr 24px;gap:10px;padding:9px 10px;background:var(--surface);
  border:1px solid var(--border);border-radius:8px;align-items:start;cursor:pointer;text-align:left;
  width:100%}
.acard:hover{border-color:var(--border-strong)}
.acard.active{border-color:var(--accent-line);box-shadow:0 0 0 2px var(--accent-soft)}
.acard .num{font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--accent);
  background:var(--accent-soft);border-radius:5px;height:20px;display:grid;place-items:center;
  font-variant-numeric:tabular-nums}
.acard .quote{font-size:11.5px;color:var(--ink-2);border-left:2px solid var(--accent-line);
  padding-left:8px;margin-bottom:5px;line-height:1.5;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.acard .cmt{font-size:13px;line-height:1.6;color:var(--ink);white-space:pre-wrap}
.acard .meta{font-family:var(--font-mono);font-size:10px;color:var(--ink-3);margin-top:5px;display:flex;
  gap:8px;align-items:center}
.acard .del{width:24px;height:24px;display:grid;place-items:center;border-radius:5px;color:var(--ink-3);
  opacity:0}
.acard:hover .del{opacity:1}
.acard .del:hover{background:var(--surface-3);color:var(--danger)}
.acard .del svg{width:13px;height:13px}
.acard.gone{opacity:.66}
.acard.gone .num{color:var(--ink-3);background:var(--surface-3)}
.acard.gone .quote{border-left-color:var(--border-strong);text-decoration:line-through}
.tag-gone{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.05em;color:var(--ink-3);
  border:1px solid var(--border);border-radius:4px;padding:0 5px}
.shelf-empty{padding:2px 14px 16px;font-size:12.5px;color:var(--ink-3);line-height:1.8}
.shelf-empty kbd{font-family:var(--font-mono);font-size:11px;background:var(--surface);
  border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:1px 5px;
  color:var(--ink-2)}

/* status bar --------------------------------------------------- */
.status{flex:0 0 26px;display:flex;align-items:center;gap:15px;padding:0 14px;background:var(--surface-2);
  border-top:1px solid var(--border);font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.status .right{margin-left:auto;display:flex;gap:15px;align-items:center}
.status .saved{color:var(--ink-2);display:flex;align-items:center;gap:6px}
.status .saved .d{width:5px;height:5px;border-radius:50%;background:var(--link)}

/* floating layers ---------------------------------------------- */
.menu{position:fixed;z-index:60;min-width:216px;background:var(--surface);
  border:1px solid var(--border-strong);border-radius:8px;box-shadow:var(--shadow-pop);padding:5px;
  display:none}
.menu.open{display:block}
.menu button{width:100%;display:flex;align-items:center;gap:10px;padding:6px 9px;border-radius:5px;
  font-size:12.5px;color:var(--ink);text-align:left}
.menu button .k{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3)}
.menu button:hover:not(:disabled){background:var(--surface-3)}
.menu button:disabled{color:var(--ink-3);cursor:default}
.menu button svg{width:14px;height:14px;color:var(--ink-2);flex:0 0 14px}
.menu .primary{color:var(--accent);font-weight:600}
.menu .primary svg{color:var(--accent)}
.menu .primary:hover:not(:disabled){background:var(--accent-soft)}
.menu .primary:disabled,.menu .primary:disabled svg{color:var(--ink-3);font-weight:500}
.menu hr{border:0;border-top:1px solid var(--border);margin:5px 4px}

.composer{position:fixed;z-index:70;width:316px;background:var(--surface);
  border:1px solid var(--border-strong);border-radius:10px;box-shadow:var(--shadow-pop);padding:11px;
  display:none}
.composer.open{display:block}
.composer .q{font-size:11.5px;color:var(--ink-2);border-left:2px solid var(--accent-line);padding-left:8px;
  margin-bottom:9px;line-height:1.5;max-height:40px;overflow:hidden}
.composer textarea{width:100%;height:76px;resize:none;font:inherit;font-size:13px;line-height:1.6;
  color:var(--ink);background:var(--surface-2);border:1px solid var(--border);border-radius:7px;
  padding:8px 9px;outline:none}
.composer textarea::placeholder{color:var(--ink-3)}
.composer textarea:focus{border-color:var(--accent-line);background:var(--surface)}
.composer .row{display:flex;align-items:center;gap:8px;margin-top:9px}
.composer .hint{font-family:var(--font-mono);font-size:10px;color:var(--ink-3);flex:1}
.btn{height:27px;padding:0 12px;border-radius:6px;font-size:12px;font-weight:500;
  border:1px solid var(--border);background:var(--surface-2)}
.btn:hover{background:var(--surface-3)}
.btn.fill{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.fill:hover{filter:brightness(1.08)}

.tip{position:fixed;z-index:80;max-width:292px;background:var(--surface);
  border:1px solid var(--border-strong);border-left:2px solid var(--accent-line);border-radius:8px;
  box-shadow:var(--shadow-pop);padding:9px 11px;display:none;pointer-events:none}
.tip.open{display:block}
.tip .c{font-size:12.5px;line-height:1.6;color:var(--ink);white-space:pre-wrap}
.tip .m{font-family:var(--font-mono);font-size:10px;color:var(--ink-3);margin-top:6px;display:flex;gap:8px}

.toast{position:fixed;left:50%;bottom:36px;transform:translate(-50%,14px);z-index:90;background:var(--ink);
  color:var(--bg);font-size:12.5px;line-height:1.5;max-width:min(460px,84vw);padding:9px 15px;

/* ── 마크다운 → HTML ─────────────────────────────────────────── */
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function bare(s){ return String(s).replace(RE_OPEN,"").replace(RE_END,"").replace(RE_ANY,""); }
function assetUrl(u){ return ASSETS[u] || u; }

function inl(s){
  s = esc(s);
  var codes = [];
  s = s.replace(/`([^`]+)`/g, function(m,c){ codes.push(c); return "@@CN-CODE-"+(codes.length-1)+"@@"; });
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, function(m,a,u){
        return '<img src="'+assetUrl(bare(u))+'" alt="'+bare(a)+'">'; });
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function(m,t,u){
        return '<a href="'+bare(u)+'" target="_blank" rel="noopener noreferrer">'+t+'</a>'; });
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  s = s.replace(/~~([^~]+)~~/g, "<del>$1</del>");
  s = s.replace(/==([^=]+)==/g, "<mark>$1</mark>");
  s = s.replace(/@@CN-CODE-(\d+)@@/g, function(m,n){ return "<code>"+codes[+n]+"</code>"; });
  return s;
}

function renderMd(text){
  var lines = String(text).replace(/\r/g,"").split("\n");
  var out = "", para = [], i = 0, m;
  function closeP(){ if(para.length){ out += "<p>"+para.map(inl).join("<br>")+"</p>"; para = []; } }
  while(i < lines.length){
    var ln = lines[i], flat = bare(ln);
    if(/^```/.test(flat)){
      closeP(); i++;
      var body = [];
      while(i < lines.length && !/^```/.test(bare(lines[i]))){ body.push(lines[i]); i++; }
      i++;
      out += "<pre><code>" + esc(body.join("\n")) + "</code></pre>";
      continue;
    }
    if(!flat.trim()){ closeP(); i++; continue; }
    if((m = ln.match(/^(#{1,6})\s+([\s\S]*)$/))){
      closeP();
      var lv = Math.min(m[1].length, 3);
      out += "<h"+lv+">"+inl(m[2])+"</h"+lv+">"; i++; continue;
    }
    if(/^(-{3,}|\*{3,}|_{3,})\s*$/.test(flat)){ closeP(); out += "<hr>"; i++; continue; }
    if(/^>\s?/.test(flat)){
      closeP();
      var q = [];
      while(i < lines.length && /^>\s?/.test(bare(lines[i]))){ q.push(lines[i].replace(/^>\s?/,"")); i++; }
      out += "<blockquote>"+q.map(inl).join("<br>")+"</blockquote>";
      continue;
    }
    if(flat.indexOf("|") > -1 && lines[i+1] && /^[\s|:-]*-[\s|:-]*$/.test(bare(lines[i+1]))){
      closeP();
      var cells = function(row){
        return row.replace(/^\s*\|/,"").replace(/\|\s*$/,"").split("|").map(function(x){ return x.trim(); });
      };
      var head = cells(ln); i += 2;
      var rows = [];
      while(i < lines.length && bare(lines[i]).indexOf("|") > -1 && bare(lines[i]).trim()){
        rows.push(cells(lines[i])); i++;
      }
      out += '<div class="tw"><table><thead><tr>'
           + head.map(function(h){ return "<th>"+inl(h)+"</th>"; }).join("")
           + "</tr></thead><tbody>"
           + rows.map(function(r){
               return "<tr>"+r.map(function(c){ return "<td>"+inl(c)+"</td>"; }).join("")+"</tr>";
             }).join("")
           + "</tbody></table></div>";
      continue;
    }
    if(/^\s*[-*+]\s+/.test(flat)){
      closeP();
      var ui = [];
      while(i < lines.length && /^\s*[-*+]\s+/.test(bare(lines[i]))){
        ui.push(lines[i].replace(/^\s*[-*+]\s+/,"")); i++;
      }
      out += "<ul>"+ui.map(function(t){ return "<li>"+inl(t)+"</li>"; }).join("")+"</ul>";
      continue;
    }
    if(/^\s*\d+[.)]\s+/.test(flat)){
      closeP();
      var oi = [];
      while(i < lines.length && /^\s*\d+[.)]\s+/.test(bare(lines[i]))){
        oi.push(lines[i].replace(/^\s*\d+[.)]\s+/,"")); i++;
      }
      out += "<ol>"+oi.map(function(t){ return "<li>"+inl(t)+"</li>"; }).join("")+"</ol>";
      continue;
    }
    para.push(ln); i++;
  }
  closeP();
  return out;
}

/* ── 오프셋 → 렌더 결과의 주석 span ─────────────────────────── */
/* 각 주석 구간을 줄 단위로 쪼개고 줄머리 기호 뒤로 밀어 넣는다.
   그래서 경계가 블록 요소를 가로지르지 않고, "- " 같은 기호도 물지 않는다. */
function injectMarks(text, ranges){
  var ins = [];
  Object.keys(ranges).forEach(function(id){
    var r = ranges[id];
    if(!r || r.end <= r.start) return;
    var parts = text.slice(r.start, r.end).split("\n");
    var pos = r.start;
    parts.forEach(function(part){
      var lineStart = text.lastIndexOf("\n", pos - 1) + 1;
      var nl = text.indexOf("\n", lineStart);
      var lineText = text.slice(lineStart, nl < 0 ? text.length : nl);
      var s = pos, e = pos + part.length;
      if(s === lineStart){
        var lead = text.slice(lineStart).match(RE_LEAD);
        if(lead && lead[0]) s = Math.min(lineStart + lead[0].length, e);
      }
      /* 표 행이면 셀 경계에서 한 번 더 쪼갠다 — span 이 td 를 넘을 수 없다 */
      var segs = [];
      if(/^\s*\|/.test(lineText)){
        var cur = s;
        for(var k = s; k < e; k++){
          if(text.charAt(k) === "|"){
            if(k > cur) segs.push([cur, k]);
            cur = k + 1;
          }
        }
        if(e > cur) segs.push([cur, e]);
      }else{
        segs.push([s, e]);
      }
      segs.forEach(function(seg){
        var a = seg[0], b = seg[1];
        while(a < b && /\s/.test(text.charAt(a))) a++;
        while(b > a && /\s/.test(text.charAt(b-1))) b--;
        if(b > a){
          ins.push({pos:a, open:true, str:M_OPEN + id + M_SEP});
          ins.push({pos:b, open:false, str:M_END});
        }
      });
      pos += part.length + 1;
    });
  });
  ins.sort(function(a,b){
    if(b.pos !== a.pos) return b.pos - a.pos;
    return (a.open ? -1 : 1);
  });
  var out = text;
  ins.forEach(function(x){ out = out.slice(0, x.pos) + x.str + out.slice(x.pos); });
  return out;
}
function renderInto(target, text, ranges){
  var html = renderMd(injectMarks(text, ranges));
  html = html.replace(RE_OPEN, '<span class="anno" data-anno="$1">').replace(RE_END, "</span>");
  html = html.replace(RE_ANY, "");
  target.innerHTML = html;
}

/* ── 원문 패널 읽기 / 쓰기 ──────────────────────────────────── */
/* 원문 DOM 을 훑어 텍스트와 주석 오프셋을 함께 얻는다 */
function readSource(){
  var text = "", ranges = {};
  (function walk(node, annoId){
    for(var c = node.firstChild; c; c = c.nextSibling){
      if(c.nodeType === 3){
        if(annoId){
          var r = ranges[annoId];
          if(!r) ranges[annoId] = {start:text.length, end:text.length + c.nodeValue.length};
          else r.end = text.length + c.nodeValue.length;
        }
        text += c.nodeValue;
      }else if(c.nodeType === 1){
        if(c.nodeName === "BR"){ text += "\n"; continue; }
        var id = annoId;
        if(c.classList && c.classList.contains("anno")) id = c.getAttribute("data-anno");
        if(/^(DIV|P)$/.test(c.nodeName) && text && text.charAt(text.length-1) !== "\n") text += "\n";
        walk(c, id);
      }
    }
  })(src, null);
  return {text:text, ranges:ranges};
}
/* 텍스트 + 오프셋으로 원문 패널을 다시 만든다 */
function writeSource(text, ranges){
  src.textContent = text;
  var ids = Object.keys(ranges).sort(function(a,b){ return ranges[b].start - ranges[a].start; });
  ids.forEach(function(id){
    var r = ranges[id];
    if(!r) return;
    var node = null, off = 0;
    /* 텍스트 노드는 앞선 span 삽입으로 쪼개져 있을 수 있으므로 매번 찾는다 */
    var walker = document.createTreeWalker(src, NodeFilter.SHOW_TEXT, null), n;
    var start = Math.max(0, Math.min(r.start, text.length));
    var end = Math.max(start, Math.min(r.end, text.length));
    if(end <= start) return;
    var a = null, b = null;
    while((n = walker.nextNode())){
      var len = n.nodeValue.length;
      if(!a && start >= off && start < off + len) a = {node:n, off:start - off};
      if(!b && end > off && end <= off + len) b = {node:n, off:end - off};
      off += len;
      if(a && b) break;
    }
    if(!a || !b) return;
    var range = document.createRange();
    range.setStart(a.node, a.off);
    range.setEnd(b.node, b.off);
    var span = document.createElement("span");
    span.className = "anno";
    span.setAttribute("data-anno", id);
    try{ span.appendChild(range.extractContents()); range.insertNode(span); }catch(e){}
  });
  src.normalize();
}

/* ── 위지윅 DOM → 마크다운 ──────────────────────────────────── */
function serializeDoc(root){
  var out = "", ranges = {}, prefix = "";
  function emit(s){ out += s; }
  function blank(){
    if(!out) return;
    if(/\n\n$/.test(out)) return;
    emit(/\n$/.test(out) ? "\n" : "\n\n");
  }
  function record(id, start){
    var r = ranges[id];
    if(!r) ranges[id] = {start:start, end:out.length};
    else { r.start = Math.min(r.start, start); r.end = Math.max(r.end, out.length); }
  }
  function walk(node, inPre){
    for(var c = node.firstChild; c; c = c.nextSibling){
      if(c.nodeType === 3){ emit(c.nodeValue.replace(/ /g," ")); continue; }
      if(c.nodeType !== 1) continue;
      if(c.classList && c.classList.contains("anno")){
        var id = c.getAttribute("data-anno"), st = out.length;
        walk(c, inPre);

      }
      var tag = c.nodeName;
      switch(tag){
        case "BR": emit("\n" + prefix); break;
        case "STRONG": case "B": emit("**"); walk(c, inPre); emit("**"); break;
        case "EM": case "I": emit("*"); walk(c, inPre); emit("*"); break;
        case "DEL": case "S": case "STRIKE": emit("~~"); walk(c, inPre); emit("~~"); break;
        case "MARK": emit("=="); walk(c, inPre); emit("=="); break;
        case "CODE":
          if(inPre){ walk(c, inPre); } else { emit("`"); walk(c, inPre); emit("`"); }

        case "A": emit("["); walk(c, inPre); emit("](" + (c.getAttribute("href")||"") + ")"); break;

          break;
        case "P":

        case "DIV": blank(); walk(c, inPre); emit("\n\n"); break;

        case "PRE":
          blank();

          walk(c, true);

          break;
        case "HR": blank(); emit("---\n\n"); break;

          blank();

}

/* ── 선택 영역 ───────────────────────────────────────────────── */

    try{
      span.appendChild(p.range.extractContents());
      p.range.insertNode(span);
    }catch(e){
      showToast("이 구간에는 주석을 달 수 없습니다. 선택 범위를 조금 줄여 보세요.");
      closeComposer();
      return;
    }
    var got = serializeDoc(doc);
    if(!got.ranges[id]){
      showToast("이 구간을 마크다운으로 되돌리지 못했습니다.");
      closeComposer();
      return;
    }
    state.text = got.text;
    state.note.src = got.text;
    start = got.ranges[id].start;
    end = got.ranges[id].end;
  }else{
    start = p.start;
    end = p.end;
  }

  state.note.annos.push({
    id:id, start:start, end:end, comment:body,
    text:state.text.slice(start, end).replace(/\s+/g," ").trim(),
    at:"오늘 " + ("0"+h).slice(-2) + ":" + mm
  });
  state.activeId = id;
  window.getSelection().removeAllRanges();
  closeComposer();

  /* 오프셋이 진짜니까 그 오프셋으로 양쪽 패널을 맞춘다 */
  var ranges = rangesOf(state.note);
  if(state.mode === "wysiwyg"){
    syncFrom(doc);            /* 스팬이 이미 DOM 에 있으니 다시 그리지 않는다 */
  }else{
    writeSource(state.text, ranges);
    renderInto(doc, state.text, ranges);
    syncFrom(src);
  }
  renderShelf();
  shelf.classList.remove("collapsed");
  $("shelfToggle").setAttribute("aria-expanded","true");
  $("shelfToggleLabel").textContent = "접기";
  markSaved();
  focusAnno(id, true);
}

/* ── 툴팁 ────────────────────────────────────────────────────── */
function showTip(el){
  var a = annoById(el.getAttribute("data-anno"));
  if(!a) return;
  tipText.textContent = a.comment;
  tipMeta.innerHTML = "";
  var who = document.createElement("span"); who.textContent = "나";
  var when = document.createElement("span"); when.textContent = a.at;
  tipMeta.appendChild(who); tipMeta.appendChild(when);
  tip.classList.add("open");
  var r = el.getBoundingClientRect();
  var top = r.top - tip.offsetHeight - 8;
  if(top < 8) top = r.bottom + 8;
  var p = clampInto(tip, r.left, top);
  tip.style.left = p.x + "px";
  tip.style.top = p.y + "px";
}
function hideTip(){ tip.classList.remove("open"); }

/* ── 주석으로 이동 ───────────────────────────────────────────── */
function scrollTo(scroller, el){
  if(!scroller || !el) return;
  var sr = scroller.getBoundingClientRect(), er = el.getBoundingClientRect();
  var delta = (er.top - sr.top) - (scroller.clientHeight / 2 - er.height / 2);
  state.suppressSync = true;
  scroller.scrollTop += delta;
  setTimeout(function(){ state.suppressSync = false; }, 220);
}
function focusAnno(id, quiet){
  var a = annoById(id);
  state.activeId = id;
  [].forEach.call(document.querySelectorAll(".anno"), function(el){
    el.classList.toggle("active", el.getAttribute("data-anno") === id);
  });
  [].forEach.call(shelfList.children, function(c){
    c.classList.toggle("active", c.getAttribute("data-anno-card") === id);
  });
  if(a && a.gone){
    if(!quiet) showToast("이 주석이 가리키던 구간이 본문에 없습니다. 지우거나 그대로 둘 수 있습니다.");
    return;
  }
  var inDoc = doc.querySelector('[data-anno="'+id+'"]');
  if(inDoc){
    scrollTo(prevScroll, inDoc);
    inDoc.classList.remove("flash"); void inDoc.offsetWidth; inDoc.classList.add("flash");
  }
  if(state.mode !== "wysiwyg"){
    var inSrc = src.querySelector('[data-anno="'+id+'"]');
    if(inSrc){
      scrollTo(srcScroll, inSrc);
      inSrc.classList.remove("flash"); void inSrc.offsetWidth; inSrc.classList.add("flash");
    }
  }
}
function deleteAnno(id){
  state.note.annos = state.note.annos.filter(function(a){ return a.id !== id; });
  if(state.activeId === id) state.activeId = null;
  var ranges = rangesOf(state.note);
  if(state.mode === "wysiwyg"){
    renderInto(doc, state.text, ranges);
    syncFrom(doc);
  }else{
    writeSource(state.text, ranges);
    renderInto(doc, state.text, ranges);
    syncFrom(src);
  }
  renderShelf();
  markSaved();
  showToast("주석을 지웠습니다.");
}

/* ── 서식 ────────────────────────────────────────────────────── */
function activeEditable(){ return state.mode === "wysiwyg" ? doc : src; }
function wrapSelection(mark){
  var el = activeEditable();
  el.focus();
  var sel = window.getSelection();
  var text = (sel && !sel.isCollapsed) ? sel.toString() : "";
  document.execCommand("insertText", false, mark + text + mark);
}
function applyFmt(kind){
  if(state.mode === "wysiwyg"){
    doc.focus();
    if(kind === "h1") document.execCommand("formatBlock", false, "h1");
    else if(kind === "h2") document.execCommand("formatBlock", false, "h2");
    else if(kind === "quote") document.execCommand("formatBlock", false, "blockquote");
    else if(kind === "code") document.execCommand("formatBlock", false, "pre");
    else if(kind === "ul") document.execCommand("insertUnorderedList", false, null);
    else if(kind === "bold") document.execCommand("bold", false, null);
    else if(kind === "italic") document.execCommand("italic", false, null);
    else if(kind === "link") document.execCommand("createLink", false, "https://");
    else if(kind === "image") insertImage("");
    state.wysiwygDirty = true;
    return;
  }
  switch(kind){
    case "bold": wrapSelection("**"); break;
    case "italic": wrapSelection("*"); break;
    case "code": wrapSelection("`"); break;
    case "h1": case "h2": case "ul": case "quote": {
      var mark = kind === "h1" ? "# " : kind === "h2" ? "## " : kind === "ul" ? "- " : "> ";
      src.focus();
      document.execCommand("insertText", false, mark);
      break;
    }
    case "link": {
      var sel = window.getSelection();
      var t = (sel && !sel.isCollapsed) ? sel.toString() : "링크";
      src.focus();
      document.execCommand("insertText", false, "[" + t + "](https://)");
      break;
    }
    case "image": insertImage(""); break;
  }
}
function insertImage(url){
  var el = activeEditable();
  el.focus();
  if(state.mode === "wysiwyg"){
    if(url){ document.execCommand("insertHTML", false, '<img src="'+url+'" alt="붙여넣은 이미지">'); state.wysiwygDirty = true; }
    else showToast("이미지는 붙여넣기(Ctrl+V)나 드래그로 넣어 보세요.");
    return;
  }
  document.execCommand("insertText", false, url ? "\n![붙여넣은 이미지](" + url + ")\n" : "![설명](이미지 경로)");
}

/* ── 이벤트 ──────────────────────────────────────────────────── */
src.addEventListener("input", function(){ scheduleSync(); markSaved(); });
src.addEventListener("keydown", function(e){
  if(e.key === "Enter" && !e.shiftKey && !e.ctrlKey && !e.altKey){
    e.preventDefault();
    document.execCommand("insertText", false, "\n");
  }
});
doc.addEventListener("input", function(){
  if(state.mode === "wysiwyg"){ state.wysiwygDirty = true; markSaved(); }
});

[src, doc].forEach(function(surface){
  surface.addEventListener("contextmenu", function(e){
    e.preventDefault();
    hideTip();
    closeComposer();
    openMenu(e.clientX + 2, e.clientY + 2, currentSelection());
  });
  surface.addEventListener("paste", function(e){
    var items = e.clipboardData && e.clipboardData.items;
    if(!items) return;
    for(var i = 0; i < items.length; i++){
      if(items[i].type && items[i].type.indexOf("image") === 0){
        var file = items[i].getAsFile();
        if(file){
          e.preventDefault();
          insertImage(URL.createObjectURL(file));
          showToast("이미지를 넣었습니다.");
          return;
        }
      }
    }
  });
});

menu.addEventListener("click", function(e){
  var b = e.target.closest("button");
  if(!b || b.disabled) return;
  var act = b.getAttribute("data-act");
  var sel = state.menuSel;
  closeMenu();
  if(act === "copy"){ document.execCommand("copy"); showToast("복사했습니다."); }
  else if(act === "cut"){ document.execCommand("cut"); scheduleSync(); }
  else if(act === "annotate" && sel){ openComposer(sel); }
  else if(act === "link"){ applyFmt("link"); }
});
document.addEventListener("mousedown", function(e){
  if(!menu.contains(e.target)) closeMenu();
  if(!locMenu.contains(e.target) && e.target.closest && !e.target.closest("#locBtn")) closeLocMenu();
  if(composer.classList.contains("open") && !composer.contains(e.target) && !menu.contains(e.target)){
    closeComposer();
  }
});
window.addEventListener("blur", closeMenu);

$("composerSave").addEventListener("click", saveAnnotation);
$("composerCancel").addEventListener("click", closeComposer);
composerText.addEventListener("keydown", function(e){
  if(e.key === "Enter" && (e.ctrlKey || e.metaKey)){ e.preventDefault(); saveAnnotation(); }
  else if(e.key === "Escape"){ e.preventDefault(); closeComposer(); }
});

document.addEventListener("mouseover", function(e){
  var el = e.target.closest ? e.target.closest(".anno") : null;
  if(el) showTip(el);
});
document.addEventListener("mouseout", function(e){
  if(e.target.closest && e.target.closest(".anno")) hideTip();
});
document.addEventListener("click", function(e){
  var mark = e.target.closest ? e.target.closest(".anno") : null;
  if(mark){ focusAnno(mark.getAttribute("data-anno")); return; }
  var del = e.target.closest ? e.target.closest("[data-del]") : null;
  if(del){ e.stopPropagation(); deleteAnno(del.getAttribute("data-del")); return; }
  var card = e.target.closest ? e.target.closest("[data-anno-card]") : null;
  if(card){ focusAnno(card.getAttribute("data-anno-card")); return; }
  var dir = e.target.closest ? e.target.closest("[data-dir]") : null;
  if(dir){
    var d = DIRS[dir.getAttribute("data-dir")];
    if(d){ d.open = !d.open; renderTree(); }
    return;
  }
  var loc = e.target.closest ? e.target.closest("[data-loc]") : null;
  if(loc){
    var p = loc.getAttribute("data-loc");
    closeLocMenu();
    if(p === "__pick__"){
      showToast("실제 앱에서는 윈도우 폴더 선택 창이 열립니다. 고른 폴더의 .md 파일을 그대로 읽어 트리에 보여줍니다.");
    }else if(p !== curLoc){
      curLoc = p;
      locPath.textContent = p;
      updatePath();
      showToast("저장 위치를 바꿨습니다. 시안이라 트리 내용은 그대로 둡니다.");
    }
    return;
  }
  var note = e.target.closest ? e.target.closest("[data-note]") : null;
  if(note){
    var id = note.getAttribute("data-note");
    NOTES.forEach(function(n){ if(n.id === id) loadNote(n); });
  }
});
shelfList.addEventListener("keydown", function(e){
  var card = e.target.closest ? e.target.closest("[data-anno-card]") : null;
  if(card && (e.key === "Enter" || e.key === " ")){
    e.preventDefault();
    focusAnno(card.getAttribute("data-anno-card"));
  }
});

[].forEach.call(document.querySelectorAll("[data-fmt]"), function(b){
  b.addEventListener("click", function(){ applyFmt(b.getAttribute("data-fmt")); });
});
$("annoBtn").addEventListener("click", function(){
  var sel = currentSelection();
  if(!sel){ showToast("먼저 본문에서 주석을 달 구간을 선택하세요."); return; }
  openComposer(sel);
});
$("modeSeg").addEventListener("click", function(e){
  var b = e.target.closest("button");
  if(b) setMode(b.getAttribute("data-mode"));
});
$("themeSeg").addEventListener("click", function(e){
  var b = e.target.closest("button");
  if(b) setTheme(b.getAttribute("data-theme-set"), true);
});
$("railToggle").addEventListener("click", function(){ rail.classList.toggle("hidden"); });
$("locBtn").addEventListener("click", function(e){
  e.stopPropagation();
  if(locMenu.classList.contains("open")) closeLocMenu();
  else openLocMenu();
});
$("newNote").addEventListener("click", function(){
  var i = 1, name;
  do { name = "새 노트" + (i > 1 ? " " + i : "") + ".md"; i++; }
  while(NOTES.some(function(n){ return n.file === name; }));
  var n = {id:"n" + (state.seq++), title:name.replace(/\.md$/,""), file:name,
           date:"08-23", src:"# " + name.replace(/\.md$/,"") + "\n\n", annos:[]};
  NOTES.push(n);
  TREE.push({type:"file", note:n.id});
  indexTree();
  loadNote(n);
  src.focus();
});
$("newFolder").addEventListener("click", function(){
  var i = 1, name;
  do { name = "새 폴더" + (i > 1 ? " " + i : ""); i++; }
  while(TREE.some(function(x){ return x.type === "dir" && x.name === name; }));
  TREE.unshift({type:"dir", name:name, open:true, children:[]});
  indexTree();
  renderTree();
  showToast("폴더를 만들었습니다. 실제 앱에서는 저장 위치 안에 폴더가 생깁니다.");
});
$("shelfToggle").addEventListener("click", function(){
  var collapsed = shelf.classList.toggle("collapsed");
  this.setAttribute("aria-expanded", String(!collapsed));
  $("shelfToggleLabel").textContent = collapsed ? "펼치기" : "접기";
});

/* 패널 너비 */
(function(){
  var dragging = false;
  divider.addEventListener("mousedown", function(e){ dragging = true; e.preventDefault(); });
  window.addEventListener("mousemove", function(e){
    if(!dragging) return;
    var box = panes.getBoundingClientRect();
    var ratio = Math.max(0.22, Math.min(0.78, (e.clientX - box.left) / box.width));
    paneSrc.style.flex = ratio + " 1 0";
    panePrev.style.flex = (1 - ratio) + " 1 0";
  });
  window.addEventListener("mouseup", function(){ dragging = false; });
})();

/* 스크롤 동기 — 한쪽을 굴리면 다른 쪽도 같은 비율로 따라간다 */
(function(){
  var lock = null;
  function ratioOf(el){
    var span = el.scrollHeight - el.clientHeight;
    return span > 0 ? el.scrollTop / span : 0;
  }
  function follow(from, to){
    if(state.mode === "wysiwyg" || state.suppressSync) return;
    if(lock && lock !== from) return;
    lock = from;
    var span = to.scrollHeight - to.clientHeight;
    to.scrollTop = ratioOf(from) * span;
    clearTimeout(follow.t);
    follow.t = setTimeout(function(){ lock = null; }, 120);
  }
  srcScroll.addEventListener("scroll", function(){ follow(srcScroll, prevScroll); });
  prevScroll.addEventListener("scroll", function(){ follow(prevScroll, srcScroll); });
})();

/* 이미지 드래그 앤 드롭 */
var dragDepth = 0;
panes.addEventListener("dragenter", function(e){ e.preventDefault(); dragDepth++; drop.classList.add("open"); });
panes.addEventListener("dragover", function(e){ e.preventDefault(); });
panes.addEventListener("dragleave", function(){
  dragDepth--;
  if(dragDepth <= 0){ dragDepth = 0; drop.classList.remove("open"); }
});
panes.addEventListener("drop", function(e){
  e.preventDefault();
  dragDepth = 0;
  drop.classList.remove("open");
  var files = e.dataTransfer && e.dataTransfer.files;
  if(!files || !files.length) return;
  var added = 0;
  for(var i = 0; i < files.length; i++){
    if(files[i].type.indexOf("image") === 0){ insertImage(URL.createObjectURL(files[i])); added++; }
  }
  showToast(added ? "이미지 " + added + "개를 넣었습니다." : "이미지 파일만 넣을 수 있습니다.");
});
window.addEventListener("dragover", function(e){ e.preventDefault(); });
window.addEventListener("drop", function(e){ e.preventDefault(); });

/* 단축키 */
document.addEventListener("keydown", function(e){
  var ctrl = e.ctrlKey || e.metaKey;
  if(ctrl && e.altKey && e.code === "KeyM"){
    e.preventDefault();
    var sel = currentSelection();
    if(sel) openComposer(sel);
    else showToast("먼저 본문에서 주석을 달 구간을 선택하세요.");
    return;
  }
  if(ctrl && e.altKey && e.code === "KeyP"){
    e.preventDefault();
    setMode(state.mode === "md" ? "wysiwyg" : "md");
    return;
  }
  if(ctrl && e.altKey && e.code === "KeyT"){
    e.preventDefault();
    var ts = ["system","light","dark"];
    setTheme(ts[(ts.indexOf(state.theme) + 1) % 3], true);
    return;
  }
  if(ctrl && e.altKey && e.code === "KeyB"){
    e.preventDefault();
    rail.classList.toggle("hidden");
    return;
  }
  if(ctrl && e.shiftKey && e.code === "KeyO"){ e.preventDefault(); openLocMenu(); return; }
  if(ctrl && !e.altKey && !e.shiftKey && e.code === "KeyN"){ e.preventDefault(); $("newNote").click(); return; }
  if(ctrl && !e.altKey && e.code === "KeyS"){ e.preventDefault(); markSaved(); showToast("저장했습니다."); return; }
  if(ctrl && !e.altKey && e.code === "KeyB"){ e.preventDefault(); applyFmt("bold"); return; }
  if(ctrl && !e.altKey && e.code === "KeyI"){ e.preventDefault(); applyFmt("italic"); return; }
  if(ctrl && !e.altKey && e.code === "KeyK"){ e.preventDefault(); applyFmt("link"); return; }
  if(e.key === "Escape"){ closeMenu(); closeComposer(); hideTip(); }
});

/* ── 시작 ────────────────────────────────────────────────────── */
/* 샘플 주석은 인용문으로 적어 두고, 여기서 한 번만 오프셋으로 바꾼다 */
NOTES.forEach(function(n){
  n.annos = n.annos.filter(function(a){
    var i = n.src.indexOf(a.find);
    if(i < 0) return false;
    a.start = i; a.end = i + a.find.length; a.text = a.find;
    return true;
  });
});
initTheme();
indexTree();
locPath.textContent = curLoc;
loadNote(NOTES[0]);
setTimeout(function(){
  showToast("본문에서 구간을 선택하고 우클릭 → 주석 달기. 원문·미리보기·위지윅 어디서 달아도 같은 구간에 남습니다.");
}, 900);

})();
</script>
