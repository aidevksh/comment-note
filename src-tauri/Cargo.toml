[package]
name = "comment-note"
version = "0.1.1"
description = "주석을 달 수 있는 마크다운 메모장"
authors = ["aidevksh"]
license = "MIT"
repository = "https://github.com/aidevksh/comment-note"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "comment_note_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 삭제는 완전 삭제가 아니라 휴지통으로 보낸다
trash = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
