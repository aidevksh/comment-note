# cargo-deny 설정 — 의존성 라이선스 검사
#
# 목적: GPL / AGPL / LGPL 처럼 앱 전체에 소스 공개 의무를 옮기는 라이선스가
# 의존성 그래프에 섞여 들어오면 CI 를 실패시킨다.
# 아래 allow 목록에 없는 라이선스는 전부 오류로 잡힌다 (version = 2 동작).

[graph]
# 배포하는 조합만 본다. 리눅스 전용 의존성은 그래프에서 제외한다.
targets = [
  "x86_64-pc-windows-msvc",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]

[licenses]
version = 2
confidence-threshold = 0.9

allow = [
  # 허용 계열 (자유롭게 링크·배포 가능)
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "CC0-1.0",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "OFL-1.1",
  # 약한 copyleft — 파일 단위. 해당 파일을 고치지 않고 링크만 하면
  # 내 소스를 공개할 의무가 없다. 고치게 되면 그 파일만 공개 의무가 생긴다.
  "MPL-2.0",
]

[bans]
multiple-versions = "allow"

[advisories]
# 보안 권고는 여기서 다루지 않는다 (라이선스 확인이 목적).
yanked = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "allow"
